[project]
name = "backup"
version = "0.1.0"
description = ""
authors = [
    { name = "Pierce Freeman", email = "pierce@freeman.vc" }
]
readme = "README.md"
requires-python = ">=3.8,<3.12"
dependencies = [
    "click==8.1.3",
    "icloudpd==1.12.0",
    "boto3==1.26.96",
    "tqdm==4.65.0",
    "pydantic==1.10.6",
    "python-dotenv==1.0.0",
    "rich==13.9.4",
]

[project.scripts]
backup = "backup.cli:main"

[dependency-groups]
dev = [
    "isort==5.12.0",
    "pyright>=1.1.393",
    "pytest==8.3.4",
    "ruff>=0.9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
